<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="レシピ箱">
  <meta name="theme-color" content="#d9642c">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <title>献立カレンダー - レシピ箱</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="calendar-page">
  <div id="app">
    <header class="app-header" style="padding-bottom:16px;">
      <div class="app-brand">
        <a href="./index.html" class="icon-btn" aria-label="一覧へ戻る">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div class="brand-text">
          <h1 style="font-size:18px;">献立カレンダー</h1>
        </div>
      </div>

      <div class="cal-toolbar">
        <button id="cal-prev" class="btn-text" type="button" aria-label="前の週へ">◀</button>
        <span id="cal-range-label" class="cal-range-label"></span>
        <button id="cal-next" class="btn-text" type="button" aria-label="次の週へ">▶</button>
      </div>
    </header>

    <main>
      <div id="cal-week-list" class="cal-week-list"></div>
    </main>
  </div>

  <!-- ログイン(Shortcuts経由でSafariから直接開いた場合、standaloneアプリとはセッションが別のため必要) -->
  <div id="login-overlay" class="overlay center">
    <div class="sheet login-panel">
      <svg class="brand-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="background:linear-gradient(135deg,#d9642c,#f2994a); border-radius:14px;">
        <path d="M9 17h18a1 1 0 0 1 1 1 9 9 0 0 1-9 9h0a9 9 0 0 1-9-9 1 1 0 0 1 1-1Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M11 17c0-3 1.5-4.5 1.5-6M18 17c0-3.5 2-5 2-7.5M25 17c0-3 1.5-4.5 1.5-6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h2>レシピ箱</h2>
      <p>共有パスワードを入力してください</p>

      <div id="login-not-configured" class="form-error">
        Supabaseがまだ設定されていません。<code>js/config.js</code> にProject URLとanon keyを設定してください。
      </div>

      <form id="login-form">
        <div id="login-error" class="form-error"></div>
        <div class="field">
          <label for="login-password">パスワード</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <button id="login-submit" class="btn btn-primary" type="submit">ログイン</button>
      </form>
    </div>
  </div>

  <!-- 日付詳細(その日の献立一覧+レシピ追加) -->
  <div id="day-overlay" class="overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <button class="sheet-close" id="day-close" aria-label="閉じる">✕</button>

      <!-- ステップ1: その日の献立一覧 -->
      <div id="day-main-view">
        <h2 id="day-title" style="margin:4px 0 16px; font-size:18px;"></h2>
        <div id="day-entries"></div>
        <!-- レシピに登録するほどでもない献立をテキストだけで追加する(②: 例「魚を焼く」) -->
        <div class="day-text-add-row">
          <input type="text" id="day-text-input" placeholder="テキストで追加(例: 魚を焼く)" maxlength="60" autocomplete="off">
          <button id="day-text-add-btn" class="btn btn-primary" type="button">追加</button>
        </div>
        <div class="day-add-actions">
          <button id="day-search-btn" class="btn btn-primary" type="button">🔍 検索して追加</button>
          <button id="day-random-btn" class="btn btn-primary" type="button">🎲 ランダムで追加</button>
        </div>
      </div>

      <!-- ステップ2: 検索/ランダムの条件と結果(⑫: 一覧より上の領域は表示せず、モードが分かる見出しのみ出す) -->
      <div id="day-filter-panel" class="day-filter-panel hidden">
        <button id="day-filter-back" class="btn-text" type="button" style="padding:4px 0 14px;">◀ 戻る</button>
        <h2 id="day-filter-mode-label" style="margin:0 0 14px; font-size:18px;"></h2>

        <!-- 検索・ランダムどちらも「条件を選ぶ」ステップでのみ表示し、確定(検索する/決める!)を押したら
             隠して結果ステップへ遷移する(検索・ランダムで同じ画面遷移にするため)。 -->
        <div id="day-filter-conditions">
          <div class="field-list">
            <div class="field-row">
              <p class="field-row-label">評価</p>
              <div id="day-filter-rating-row" class="field-row-value rating-stars interactive"></div>
            </div>
            <div id="day-filter-cats"></div>
            <div class="field-row">
              <p class="field-row-label" id="day-filter-free-tag-label">タグ検索</p>
              <div class="field-row-value">
                <div class="tag-row" id="day-filter-free-tag-row"></div>
                <div class="free-tag-combo">
                  <input type="text" id="day-filter-free-tag-input" class="free-tag-picker-input" list="day-filter-free-tag-suggestions" placeholder="タグ名で選択・入力" autocomplete="off">
                  <datalist id="day-filter-free-tag-suggestions"></datalist>
                  <div id="day-filter-free-tag-dropdown" class="combo-dropdown hidden"></div>
                </div>
              </div>
            </div>
            <!-- 検索モードのみ表示(フィルタ画面と同じ並び順選択、⑪): ランダムモードでは意味がないため隠す -->
            <div id="day-search-sort-group" class="field-row hidden">
              <p class="field-row-label">並び順</p>
              <div id="day-search-sort-row" class="field-row-value tag-row"></div>
            </div>
          </div>
        </div>

        <!-- 検索モードの「条件を選ぶ」ステップ専用ボタン -->
        <div id="day-search-pick-actions" class="btn-row hidden" style="margin-top:18px;">
          <button id="day-search-clear" class="btn btn-secondary" type="button">クリア</button>
          <button id="day-search-confirm" class="btn btn-primary" type="button">検索</button>
        </div>

        <!-- ランダムモードの「決める」ステップ専用ボタン(今日は何作る?のクリア/決める!と同じ) -->
        <div id="day-random-pick-actions" class="btn-row hidden" style="margin-top:18px;">
          <button id="day-random-clear" class="btn btn-secondary" type="button">クリア</button>
          <button id="day-random-confirm" class="btn btn-primary" type="button">ランダム表示</button>
        </div>

        <!-- 検索結果は別画面(条件ステップは隠す)。1件選ぶと直下に「レシピを見る」「献立に追加」が展開される。 -->
        <div id="day-search-results" class="day-recipe-results hidden"></div>

        <div id="day-random-box" class="hidden">
          <div id="day-random-content"></div>
          <div class="btn-row" style="margin-top:10px;">
            <button id="day-random-again" class="btn btn-secondary" type="button">もう一回</button>
            <button id="day-random-view" class="btn btn-secondary" type="button">レシピを見る</button>
            <button id="day-random-add" class="btn btn-primary" type="button">献立に追加</button>
          </div>
        </div>

        <p id="day-filter-empty" class="cal-empty-note hidden">条件に合うレシピが見つかりません</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./js/calendar.js"></script>
  <script src="./js/sw-register.js"></script>
</body>
</html>
